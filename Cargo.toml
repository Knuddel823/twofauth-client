[package]
name = "twofauth-client"
version = "0.1.2"
license = "GPL-3.0-or-later"
description = "Unofficial native Linux desktop client for 2FAuth"
repository = "https://github.com/Knuddel823/twofauth-client"
homepage = "https://github.com/Knuddel823/twofauth-client"
readme = "README.md"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
gtk = { version = "0.11.4", package = "gtk4" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gettextrs = { version = "0.8.0", package = "gettext-rs" }
httpdate = "1.0.3"
keyring = "4.1.6"
toml = "1.1.4"
dirs = "6.0.0"
gdk-pixbuf = "0.22.0"
